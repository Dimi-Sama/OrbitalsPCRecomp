; Orbitals PC recomp: Steam Deck profile steam_deck_720p30 (LCD and OLED)
; tools/steamdeck/install-profile.sh writes these keys into Orbitals.ini; every other key keeps its value.
;
; Handheld mode. The game still builds a 1920x1080 picture (the Switch 2 handheld screen is 1080p): its 3D is drawn at
; 1600x900 (2 x 800x900 in co-op) and the HUD at 1920x1080, then the runtime shows it at 1280x720 on the 1280x800 screen.
docked=0
fullscreen=1
; the game's own 30 FPS (2 vblank interval, paced on 60 and 90 Hz panels) with the NVN translation on its own thread
ue_fps=30
fps_limit=1
forced_vsync=0
; the Deck's controls are player 1; a second controller (Bluetooth / USB) is player 2
keyboard_player=1
; 1 lets the game lower its 3D resolution itself as on the console (co-op: 480x540 per player): no faster on the Deck, where
; the GPU time does not follow the pixel count (see STEAM_DECK_PERFORMANCE.md), so it stays off
game_dynamic_resolution=0
